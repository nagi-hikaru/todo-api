basePath: /api/v1
definitions:
  models.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  models.PaginateResponse:
    properties:
      items: {}
      total:
        type: integer
    type: object
  models.Todo:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      description:
        description: 非必填
        type: string
      due_date:
        type: string
      id:
        description: 必填
        type: integer
      priority:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.TodoCreateRequest:
    properties:
      description:
        maxLength: 100
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - title
    type: object
  models.TodoUpdateRequest:
    properties:
      description:
        maxLength: 100
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - title
    type: object
info:
  contact: {}
  description: 基于 Gin 和 SQLite 的待办事项 API
  title: Todo API
  version: "1.0"
paths:
  /todos:
    get:
      description: 支持按状态、优先级及标题或描述关键词筛选；返回当前页任务与符合筛选条件的总数。
      parameters:
      - description: 任务状态
        enum:
        - pending
        - completed
        - cancelled
        in: query
        name: status
        type: string
      - description: 优先级
        enum:
        - low
        - medium
        - high
        in: query
        name: priority
        type: string
      - description: 标题或描述关键词，可为空
        in: query
        name: search
        type: string
      - default: 1
        description: 页码
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 分页查询结果
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/models.PaginateResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/models.Todo'
                        type: array
                    type: object
              type: object
        "400":
          description: 查询参数无效
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: 查询任务列表
      tags:
      - Todos
    post:
      consumes:
      - application/json
      description: 创建待办任务，初始状态为 pending；截止日期格式为 YYYY-MM-DD。
      parameters:
      - description: 任务信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.TodoCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: 请求参数或截止日期无效
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: 创建任务
      tags:
      - Todos
  /todos/{id}:
    delete:
      parameters:
      - description: 任务 ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: 任务 ID 无效
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: 任务不存在
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: 删除任务
      tags:
      - Todos
    get:
      parameters:
      - description: 任务 ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务详情
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: 任务 ID 无效
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: 任务不存在
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: 根据 ID 查询任务
      tags:
      - Todos
    put:
      consumes:
      - application/json
      description: 标题必填；未提供的描述、优先级和截止日期会被清空；状态保持不变；截止日期格式为 YYYY-MM-DD。
      parameters:
      - description: 任务 ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 任务信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.TodoUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的完整任务
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: 任务 ID、请求参数或截止日期无效
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: 任务不存在
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: 更新任务内容
      tags:
      - Todos
  /todos/{id}/status:
    patch:
      description: 通过查询参数传入目标状态；设为 completed 时记录完成时间，设为其他合法状态时清除完成时间。
      parameters:
      - description: 任务 ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 目标状态
        enum:
        - pending
        - completed
        - cancelled
        in: query
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 状态更新成功
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: 任务 ID 无效或状态为空
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: 任务不存在
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: 数据库更新失败，包括非法状态触发的约束错误
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: 更新任务状态
      tags:
      - Todos
swagger: "2.0"
